<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ទាញយក Files</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f0f0;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        .file {
            background: white;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .file span {
            font-size: 16px;
            color: #333;
        }

        .file a {
            background: #4CAF50;
            color: white;
            padding: 8px 15px;
            text-decoration: none;
            border-radius: 5px;
            font-size: 14px;
        }

        .file a:hover {
            background: #45a049;
        }
    </style>
</head>
<body>

    <h1>📥 ទាញយក Files</h1>

    <div class="file">
        <span>📄 ឯកសារ PDF</span>
        <a href="files/document.pdf" download>ទាញយក</a>
    </div>

    <div class="file">
        <span>🖼️ រូបភាព ZIP</span>
        <a href="files/Law.zip" download>ទាញយក</a>
    </div>

    <div class="file">
        <span>🎵 បទចម្រៀង MP3</span>
        <a href="files/song.mp3" download>ទាញយក</a>
    </div>

    <div class="file">
        <span>📊 តារាង Excel</span>
        <a href="files/data.xlsx" download>ទាញយក</a>
    </div>

</body>
</html>
